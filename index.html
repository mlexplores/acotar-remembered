<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prythian, Remembered</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg-deep: #0a0d1c;
    --bg-surface: #141a30;
    --bg-surface-2: #1d2440;
    --gold: #c9a227;
    --gold-soft: #e3c568;
    --lilac: #a596d6;
    --rose: #c06b82;
    --text-primary: #edeaf6;
    --text-muted: #9491ac;
    --border: rgba(197, 191, 226, 0.14);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg-deep);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  .starfield {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(237,234,246,0.6), transparent),
      radial-gradient(1px 1px at 70% 15%, rgba(237,234,246,0.5), transparent),
      radial-gradient(1.5px 1.5px at 85% 60%, rgba(237,234,246,0.4), transparent),
      radial-gradient(1px 1px at 40% 80%, rgba(237,234,246,0.5), transparent),
      radial-gradient(1.5px 1.5px at 55% 45%, rgba(237,234,246,0.3), transparent),
      radial-gradient(1px 1px at 10% 65%, rgba(237,234,246,0.4), transparent),
      radial-gradient(1.5px 1.5px at 92% 85%, rgba(237,234,246,0.5), transparent);
    background-repeat: repeat;
    background-size: 100% 100%;
    animation: twinkle 6s ease-in-out infinite alternate;
  }
  @media (prefers-reduced-motion: reduce) { .starfield { animation: none; } }
  @keyframes twinkle { from { opacity: 0.5; } to { opacity: 1; } }

  .app {
    position: relative;
    z-index: 1;
    max-width: 780px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }

  header { text-align: center; margin-bottom: 20px; }

  .eyebrow {
    font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--gold-soft); margin: 0 0 10px; font-weight: 600;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif; font-weight: 600;
    font-size: 46px; margin: 0 0 10px; letter-spacing: 0.5px;
  }
  .subtitle { color: var(--text-muted); font-size: 15px; margin: 0; }

  .view-switch {
    display: flex; justify-content: center; gap: 0; margin: 28px auto 32px; max-width: 420px;
    border: 1px solid var(--border); border-radius: 24px; padding: 4px; background: var(--bg-surface);
  }
  .view-btn {
    flex: 1; background: none; border: none; color: var(--text-muted);
    padding: 11px 18px; border-radius: 20px; font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 16px; cursor: pointer; transition: all 0.2s;
  }
  .view-btn:hover { color: var(--text-primary); }
  .view-btn.active { background: var(--bg-surface-2); color: var(--gold-soft); box-shadow: 0 0 0 1px var(--gold-soft) inset; }

  #book-view-wrap.hidden, #arcs-view-wrap.hidden { display: none; }
  #arcs-view-wrap { margin-bottom: 28px; }

  .cast-toggle-wrap { text-align: center; margin: 22px 0 28px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  #cast-toggle, #setting-toggle {
    background: none; border: 1px solid var(--border); color: var(--gold-soft);
    padding: 10px 22px; border-radius: 20px; font-family: 'Inter', sans-serif;
    font-size: 13px; cursor: pointer; transition: all 0.2s;
  }
  #cast-toggle:hover, #setting-toggle:hover { background: var(--bg-surface); }

  #setting-panel { margin: -8px 0 28px; }
  #setting-panel.hidden { display: none; }
  #setting-panel .card p { margin: 0; }

  .arc-person-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 14px; }
  .arc-person-chip {
    background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-muted);
    padding: 7px 14px; border-radius: 14px; font-family: 'Cormorant Garamond', serif; font-size: 15px;
    cursor: pointer; transition: all 0.2s;
  }
  .arc-person-chip:hover { color: var(--text-primary); }
  .arc-person-chip.active { background: rgba(201,162,39,0.14); border-color: var(--gold-soft); color: var(--gold-soft); }
  .arc-facet-row { display: flex; justify-content: center; gap: 4px; margin-bottom: 14px; }
  .arc-facet-btn {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    padding: 6px 14px; border-radius: 12px; font-family: 'Inter', sans-serif; font-size: 12px;
    cursor: pointer; transition: all 0.2s;
  }
  .arc-facet-btn.active { background: var(--bg-surface-2); color: var(--gold-soft); border-color: var(--gold-soft); }

  #cast-panel {
    margin: 0 0 28px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  #cast-panel.hidden { display: none; }
  .cast-card {
    background: var(--bg-surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
  }
  .cast-card .name { font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 600; color: var(--gold-soft); margin: 0 0 2px; }
  .cast-card .role { font-size: 11px; color: var(--text-muted); margin: 0 0 8px; letter-spacing: 0.3px; }
  .cast-card .trait { font-size: 13px; margin: 0 0 6px; color: var(--text-primary); }
  .cast-card .note { font-size: 12.5px; color: var(--text-muted); margin: 0; line-height: 1.5; }

  .cast-section-label {
    grid-column: 1 / -1;
    font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--gold-soft); font-weight: 700; margin: 10px 0 2px;
  }
  .cast-section-label:first-child { margin-top: 0; }
  .cast-empty {
    grid-column: 1 / -1; font-size: 13px; color: var(--text-muted); font-style: italic;
    font-family: 'Cormorant Garamond', serif; margin: 0 0 4px;
  }
  .returning-row {
    grid-column: 1 / -1;
    display: flex; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .returning-row:last-of-type { border-bottom: none; }
  .returning-row .rname {
    flex: 0 0 130px; color: var(--gold-soft); font-family: 'Cormorant Garamond', serif;
    font-size: 15px; font-weight: 600;
  }
  .returning-row .rchange { color: var(--text-muted); line-height: 1.5; }

  .book-tabs {
    display: flex; justify-content: center; gap: 6px; flex-wrap: wrap;
    margin: 0 0 20px; border-bottom: 1px solid var(--border); padding-bottom: 0;
  }
  .book-tab {
    background: none; border: none; color: var(--text-muted);
    font-family: 'Cormorant Garamond', serif; font-size: 17px; padding: 10px 14px;
    cursor: pointer; position: relative; transition: color 0.2s; text-align: center; line-height: 1.3;
  }
  .book-tab .numeral { display: block; font-size: 20px; font-weight: 600; }
  .book-tab .label { display: block; font-size: 11px; font-family: 'Inter', sans-serif; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-muted); margin-top: 2px; }
  .book-tab:hover { color: var(--text-primary); }
  .book-tab.active { color: var(--gold-soft); }
  .book-tab.active::after {
    content: ''; position: absolute; bottom: -1px; left: 10%; right: 10%; height: 2px;
    background: var(--gold-soft); box-shadow: 0 0 8px var(--gold-soft);
  }

  .mode-toggle { display: flex; justify-content: center; gap: 4px; margin-bottom: 14px; }
  .mode-btn {
    background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-muted);
    padding: 9px 20px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
  }
  .mode-btn:first-child { border-radius: 20px 0 0 20px; }
  .mode-btn:last-child { border-radius: 0 20px 20px 0; border-left: none; }
  .mode-btn.active { background: var(--bg-surface-2); color: var(--gold-soft); }

  .depth-toggle { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .depth-description {
    text-align: center; font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 14px; color: var(--text-muted); margin: 0 0 24px;
  }

  #helper-wrap { text-align: center; margin-bottom: 14px; }
  .helper-link {
    background: none; border: none; color: var(--lilac); font-family: 'Inter', sans-serif;
    font-size: 12.5px; text-decoration: underline; text-underline-offset: 3px;
    cursor: pointer; padding: 4px;
  }
  .helper-link:hover { color: var(--gold-soft); }
  .helper-card {
    background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; max-width: 480px; margin: 0 auto;
  }
  .helper-card p.helper-q {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 16px;
    color: var(--text-primary); margin: 0 0 12px;
  }
  .helper-options { display: flex; flex-direction: column; gap: 6px; }
  .helper-option {
    background: var(--bg-surface-2); border: 1px solid var(--border); color: var(--text-primary);
    padding: 9px 14px; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 13px;
    text-align: left; cursor: pointer; transition: all 0.2s;
  }
  .helper-option:hover { border-color: var(--gold-soft); color: var(--gold-soft); }
  .helper-close {
    background: none; border: none; color: var(--text-muted); font-size: 12px;
    margin-top: 10px; cursor: pointer; text-decoration: underline;
  }
  .depth-btn {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    padding: 6px 14px; border-radius: 14px; font-family: 'Inter', sans-serif; font-size: 12px;
    cursor: pointer; transition: all 0.2s;
  }
  .depth-btn:hover { color: var(--text-primary); }
  .depth-btn.active { background: rgba(201,162,39,0.14); border-color: var(--gold-soft); color: var(--gold-soft); }

  /* Timeline depth */
  .timeline-track { position: relative; padding-left: 22px; }
  .timeline-track::before {
    content: ''; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 1px;
    background: var(--border);
  }
  .timeline-phase-label {
    font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold-soft);
    font-weight: 700; margin: 18px 0 8px; position: relative;
  }
  .timeline-phase-label:first-child { margin-top: 0; }
  .timeline-item { position: relative; margin-bottom: 12px; }
  .timeline-item p { margin: 0; font-size: 14.5px; line-height: 1.6; color: var(--text-primary); }
  .timeline-dot {
    position: absolute; left: -22px; top: 6px; width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold-soft); box-shadow: 0 0 6px rgba(201,162,39,0.5);
  }

  /* Character drill-down chips */
  .char-chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .char-chip {
    background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-muted);
    padding: 6px 13px; border-radius: 14px; font-family: 'Inter', sans-serif; font-size: 12px;
    cursor: pointer; transition: all 0.2s;
  }
  .char-chip:hover { color: var(--text-primary); }
  .char-chip.active { background: rgba(201,162,39,0.14); border-color: var(--gold-soft); color: var(--gold-soft); }

  .book-heading { text-align: center; margin-bottom: 22px; }
  .book-heading h2 { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 26px; margin: 0; color: var(--text-primary); }
  .book-heading p { color: var(--text-muted); font-size: 13px; margin: 4px 0 0; }

  .card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px 24px; margin-bottom: 16px; }
  .card h3 { font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold-soft); margin: 0 0 12px; font-weight: 700; }
  .card p { margin: 0 0 10px; font-size: 15px; line-height: 1.65; color: var(--text-primary); }
  .card p:last-child { margin-bottom: 0; }
  .card ul { margin: 0; padding-left: 18px; }
  .card li { font-size: 15px; line-height: 1.65; margin-bottom: 8px; color: var(--text-primary); }
  .card li::marker { color: var(--gold-soft); }
  .card.cliffhanger { border-color: rgba(201,162,39,0.35); background: linear-gradient(180deg, var(--bg-surface), var(--bg-surface-2)); }

  /* Listen mode player */
  .player-bar {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-bottom: 16px;
  }
  .player-btn {
    background: var(--bg-surface-2); border: 1px solid var(--border); color: var(--gold-soft);
    padding: 9px 18px; border-radius: 20px; font-family: 'Inter', sans-serif; font-size: 13px;
    font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .player-btn:hover { background: rgba(201,162,39,0.14); }
  .player-btn.stop { color: var(--rose); }
  .player-note { text-align: center; font-size: 11.5px; color: var(--text-muted); margin: 0 0 16px; }

  .transcript { display: flex; flex-direction: column; gap: 14px; }
  .line { max-width: 82%; display: flex; flex-direction: column; transition: opacity 0.2s; }
  .line.wren { align-self: flex-start; }
  .line.sol { align-self: flex-end; align-items: flex-end; }
  .speaker { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
  .line.wren .speaker { color: var(--lilac); }
  .line.sol .speaker { color: var(--rose); }
  .bubble {
    padding: 12px 16px; border-radius: 14px; font-size: 14.5px; line-height: 1.55;
    background: var(--bg-surface); border: 1px solid var(--border); transition: all 0.2s;
  }
  .line.wren .bubble { border-top-left-radius: 4px; }
  .line.sol .bubble { border-top-right-radius: 4px; background: var(--bg-surface-2); }
  .line.speaking .bubble { border-color: var(--gold-soft); box-shadow: 0 0 0 1px var(--gold-soft), 0 0 16px rgba(201,162,39,0.25); }

  footer { text-align: center; margin-top: 48px; color: var(--text-muted); font-style: italic; font-family: 'Cormorant Garamond', serif; font-size: 15px; }

  @media (max-width: 480px) {
    h1 { font-size: 34px; }
    .book-tab { font-size: 14px; padding: 8px 8px; }
    .book-tab .numeral { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="starfield"></div>
<div class="app">
  <header>
    <p class="eyebrow">A personal refresher · v11</p>
    <h1>Prythian, Remembered</h1>
    <p class="subtitle">Books I&ndash;V of A Court of Thorns and Roses, before Book VI arrives</p>
  </header>

  <div class="view-switch" id="viewSwitch">
    <button class="view-btn active" data-view="book">Explore a Book</button>
    <button class="view-btn" data-view="arcs">Follow a Character</button>
  </div>

  <div id="book-view-wrap">
    <div class="cast-toggle-wrap">
      <button id="cast-toggle">Open the Cast &mdash; who's who</button>
      <button id="setting-toggle">Where We Are</button>
    </div>
    <div id="cast-panel" class="hidden"></div>
    <div id="setting-panel" class="hidden"></div>

    <nav class="book-tabs" id="bookTabs"></nav>

    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="read">Read the recap</button>
      <button class="mode-btn" data-mode="listen">Listen in</button>
    </div>

    <div id="helper-wrap"></div>

    <div class="depth-toggle" id="depthToggle"></div>
    <p class="depth-description" id="depthDescription"></p>

    <div class="book-heading" id="bookHeading"></div>

    <main id="content"></main>
  </div>

  <div id="arcs-view-wrap" class="hidden">
    <div id="arcs-panel"></div>
  </div>

  <footer>&ldquo;To the stars who listen&mdash;and the dreams that are answered.&rdquo;</footer>
</div>

<script>
const books = [
{
  numeral: 'I', label: 'Thorns & Roses', title: 'A Court of Thorns and Roses',
  depths: {
    high: {
      read: "Feyre, a human huntress, kills a faerie disguised as a wolf and is taken to the Spring Court as payment under an old treaty. She falls for Tamlin, its High Lord, while uncovering a curse driven by the faerie queen Amarantha, who's holding all seven High Lords hostage. To save Tamlin, Feyre survives three deadly trials, dies completing them, and is resurrected as High Fae by the combined power of all seven High Lords.",
      listen: [
        {who:'wren', text:"Fastest version of book one: human girl kills a faerie wolf, gets taken as payment, falls for the High Lord holding her."},
        {who:'sol', text:"Turns out his whole court is cursed by a queen named Amarantha, who's got every High Lord in Prythian trapped."},
        {who:'wren', text:"Feyre does three deadly trials to save him, dies doing it, and all seven High Lords bring her back as High Fae."},
        {who:'sol', text:"So she starts book two alive, powerful, and owing a certain Night Court High Lord a favor."}
      ]
    },
    detailed: {
      read: {
        situation: "Feyre Archeron, a human huntress keeping her family from starving after her father lost the family's fortune, kills a wolf in the woods to survive a brutal winter — not realizing it's a faerie in disguise. An old treaty between humans and faeries demands payment for a faerie's death, and Feyre is taken from the human lands into Prythian. She's grown up on stories of faeries as monsters, and has no reason yet to expect anything else.",
        events: [
          "Feyre is taken to the Spring Court under an old treaty — the rule the whole series runs on: faerie bargains are absolute, and breaking them has real consequences.",
          "The masks and the drained color in the land are the first sign this isn't a romance without stakes — Prythian is under a curse that's slowly killing it.",
          "Rhysand's bargain with Feyre — one week a year, no explanation given — looks like a throwaway threat here. It isn't; it's the seed of the entire next book.",
          "Feyre choosing to face Amarantha's trials instead of letting Tamlin die is the first time she puts someone else's life above her own survival — the pattern her whole arc is built on.",
          "Her death and resurrection by all seven High Lords is why she carries power from every court, not just Spring — a detail that matters constantly from here on.",
          "As trust grows between them, Feyre and Tamlin's relationship deepens physically — a shift that marks how far her guard has come down, right before everything is upended by the trials."
        ],
        relationships: "Feyre and Tamlin fall in love and anchor the book's romance. Rhysand is introduced as unsettling and morally grey, clearly playing a longer game. Lucien, Tamlin's fox-masked emissary, becomes a loyal friend to Feyre.\n\nThe romance here is tender rather than explicit — physical intimacy is present but understated, in keeping with this book's slower-burn tone compared to what follows.",
        cliffhanger: "Feyre is alive, reborn as High Fae, and engaged to Tamlin — but forever changed by what she survived, and quietly bound by a debt to Rhysand she hasn't paid yet."
      },
      listen: [
        {who:'wren', text:"Okay, book one. A human girl kills a wolf to feed her family, and it turns out that wolf was a faerie. That's the whole inciting incident."},
        {who:'sol', text:"Which is such a fairy-tale setup — debt paid in a life for a life. Feyre gets dragged off to the Spring Court to live with Tamlin as payment."},
        {who:'wren', text:"And obviously falls for him, because the land is cursed, everyone's wearing creepy masks, and nobody will tell her why."},
        {who:'sol', text:"The masks are the tell that something's very wrong. Turns out it all traces back to Amarantha — she's holding every High Lord in Prythian hostage under a mountain."},
        {who:'wren', text:"This is also where we meet Rhysand for the first time, and he is NOT a good guy in this book. He makes Feyre agree to a bargain — one week a year at his court — and won't say why."},
        {who:'sol', text:"Remember that. It matters a lot later. Anyway — to save Tamlin, Feyre volunteers for Amarantha's three trials. Riddle, physical trial, the works."},
        {who:'wren', text:"And she dies. Actually dies completing the last one."},
        {who:'sol', text:"And then all seven High Lords — including Rhysand — each give up a piece of their power to bring her back. So Feyre ends book one alive, High Fae, and carrying a splinter of magic from every court in Prythian."},
        {who:'wren', text:"Engaged to Tamlin, changed forever, and still owing Rhysand that bargain. Great start to a series, no notes."}
      ]
    },
    timeline: {
      read: [
        { phase: 'Opening', text: "It's the dead of winter, and Feyre — the only one of her family still willing to hunt — kills a wolf in the woods to keep them fed." },
        { text: "The wolf, it turns out, was a faerie. Under an old treaty between humans and faeries, a life must be answered with a life, or its equivalent." },
        { text: "A beast-like creature arrives at the family's door and takes Feyre across the wall into Prythian as payment — she has no say in it." },
        { phase: 'Rising', text: "She's brought to a grand, permanently blooming manor at the Spring Court, home of its High Lord, Tamlin, and his emissary, Lucien." },
        { text: "Life there is stranger than captivity should be — the faeries around her wear masks, and the land itself looks and feels drained, though no one will explain why." },
        { text: "Despite herself, Feyre grows close to Tamlin, and the wary hostility between them softens into something else." },
        { text: "A visiting Night Court emissary, Rhysand, notices her — and before leaving, strikes a private bargain: one week a year at his court, in exchange for a debt he won't name yet." },
        { text: "Piece by piece, Feyre learns the truth behind the masks and the dying land: a faerie queen named Amarantha has cursed all of Prythian and is holding every High Lord captive beneath a mountain." },
        { phase: 'Turning Point', text: "When Tamlin is called back to face Amarantha, Feyre follows — and offers herself in his place for whatever trial the queen demands." },
        { text: "Amarantha sets three trials meant to kill her. Feyre survives the first two through grit and a puzzle solved as much by instinct as by strength — and the third forces her to kill three fae with an ash dagger. The third victim is revealed to be Tamlin himself, heart turned to stone by the curse; recognizing him in time is what saves him." },
        { phase: 'Resolution', text: "Enraged, Amarantha beats Feyre and poses one final riddle before finishing her off. Feyre works out the answer — love — and speaks it aloud just as she dies." },
        { text: "In response, all seven High Lords — enemies as much as allies — each give up a piece of their own power to bring her back to life as one of them: High Fae." },
        { text: "She wakes changed, engaged to Tamlin, and carrying magic from every court in Prythian — with a bargain to Rhysand still sitting, unpaid, in the background." }
      ],
      listen: [
        {who:'wren', text:"Timeline version, straight through: Feyre kills a wolf, gets taken as payment, ends up at Spring Court with Tamlin."},

    general: "Nesta barely exists as a character until book two, when she and Elain are forced into the Cauldron against their will and turned High Fae — an event that defines everything about her going forward, even though she has almost no say in it.\n\nBooks two and three show her response to that violation: fury, refusal, closing herself off from everyone, most visibly the Night Court she blames for what happened to her family. Book four makes that response impossible to ignore — she's drinking heavily, isolating, clearly in crisis, until the people around her finally agree to intervene.\n\nBook five is entirely hers: forced into structure and training under Cassian, she befriends two women, Gwyn and Emerie, and slowly finds purpose that has nothing to do with being someone's problem to manage. Her real turning point isn't the romance with Cassian, though that's part of it — it's her unique connection to the Cauldron, which lets her destroy the book's antagonist and, in the climax, save Feyre, Rhys, and their newborn son from a dangerous premature birth, at the cost of giving back most of that power. By the end, she's rebuilding trust with her family on her own terms, not because anyone demanded it.",
    facetLabel: 'Emotional Arc',
    facet: "Nesta's arc is the series' clearest study of what happens when trauma isn't allowed a say in its own timeline. She didn't choose to become Fae, didn't choose the war, didn't choose any of the losses that came before it — and books two through four show her responding to that lack of choice the only way she has left: refusal. Refusing gratitude, refusing help, refusing to perform being okay for anyone else's comfort.\n\nWhat makes book five work is that her healing isn't framed as 'getting over it' — it's framed as finding one thing entirely hers, chosen rather than assigned. The romance with Cassian matters, but it's not what fixes her; it's what she has room for once she's already begun choosing things for herself again."
  },
  'Cassian': {
    kind: 'person',
    general: "Cassian appears from book two onward as Rhysand's general and closest friend — loud, warm, easy company, introduced mostly through his loyalty to the Inner Circle rather than any personal struggle of his own.\n\nBook three gives him a real function beyond charm: he fights in the war, and his early friction with Nesta gets properly established, though neither of them would call it anything yet. Book four keeps him mostly in a supporting role, present for the family's attempt at normalcy during the Solstice.\n\nBook five is where he actually gets an arc of his own: paired with training Nesta, his easy confidence turns out to be covering something — insecurity about his status as a lower-born Illyrian in a rigidly hierarchical warrior culture. When the book's antagonist mind-controls him and orders him to kill Nesta, he stabs himself rather than harm her — the clearest possible proof that the insecurity was never the whole story. Nesta is the first person who doesn't let him hide behind charm, and by the book's end, their bond as mates is less about her being fixed by him and more about both of them being seen without the performance.",
    facetLabel: 'Identity Arc',
    facet: "Underneath Cassian's warmth is a detail easy to miss if you're only tracking the romance: he's a bastard-born Illyrian, from a culture that ranks its warriors by bloodline, and his charm functions partly as armor against that status. Books two and three don't dwell on this, but it's there — the loudest person in the room isn't always the most secure one.\n\nBook five is the first time this actually gets examined directly, because Nesta — herself allergic to people performing being fine — doesn't let him deflect it with jokes the way everyone else does. His arc isn't really about becoming a different person; it's about being fully seen as the one he already was, insecurity included, by someone who refuses to let him hide it."
  },
  'Elain & Lucien': {
    kind: 'pair',
    general: "Their bond starts almost entirely one-sided and unspoken. Lucien is introduced in book one as Tamlin's loyal, wry emissary — nothing about him points toward Elain, who doesn't even appear as a real character until book two, when she and Nesta are forced into the Cauldron against their will.\n\nBook three is where the mating bond between them first surfaces — but crucially, it surfaces as something imposed on both of them by circumstance, not chosen. Elain, freshly and violently transformed into a life she never wanted, isn't remotely ready to engage with it, and the book respects that by leaving it unresolved rather than rushing toward romance.\n\nBook four continues that patience: Elain heals at her own pace, gardening, quietly finding herself, while her bond to Lucien simply sits there — present, acknowledged, untouched. Book five keeps the focus on Nesta, so Elain and Lucien's relationship stays exactly where it was: real, mutual on some level, and still entirely unresolved by the end of book five. This is one of the more clearly unfinished threads heading into book six — worth knowing you're not missing a resolution that already happened."
  }
};

const depthOrder = ['high', 'timeline', 'detailed', 'character', 'situation'];
const depthLabels = { high: 'High-Level', timeline: 'Timeline', detailed: 'Detailed', character: 'Character Focus', situation: 'Situation Focus' };
const depthDescriptions = {
  high: "The whole book in a few sentences — the headline, nothing else.",
  timeline: "The story itself, beat by beat, in the order it happens — a walkthrough, not a summary.",
  detailed: "The full picture, organized by why things matter — situation, key turning points, relationships, what's unresolved.",
  character: "Follow one character's arc through this book, or see everyone's shifts at once.",
  situation: "Zoomed in on the single moment of this book most worth remembering."
};

let currentBook = 0;
let currentMode = 'read';
let currentDepth = 'detailed';
let currentCharacter = 'combined';
let helperOpen = false;

const helperOptions = [
  { label: "Just remind me quickly", depth: 'high' },
  { label: "Walk me through it, start to finish", depth: 'timeline' },
  { label: "Give me the full, organized picture", depth: 'detailed' },
  { label: "I care about a character's arc", depth: 'character' },
  { label: "One key moment, in depth", depth: 'situation' }
];

// ---- Audio (Web Speech API) ----
const synth = window.speechSynthesis;
let voices = [];
function loadVoices() { voices = synth.getVoices(); }
if (synth) {
  synth.onvoiceschanged = loadVoices;
  loadVoices();
}
let isSpeaking = false;
let isPaused = false;
let currentLines = [];
let currentLineIdx = 0;

function pickVoice(who) {
  const en = voices.filter(v => v.lang && v.lang.startsWith('en'));
  const pool = en.length >= 2 ? en : voices;
  if (pool.length === 0) return null;
  return who === 'wren' ? pool[0] : pool[pool.length - 1];
}

function highlightLine(idx) {
  document.querySelectorAll('.line').forEach((el, i) => {
    el.classList.toggle('speaking', i === idx);
  });
}

function updatePlayerUI() {
  const btn = document.getElementById('playBtn');
  if (!btn) return;
  if (isSpeaking && !isPaused) btn.textContent = '\u23F8 Pause';
  else if (isSpeaking && isPaused) btn.textContent = '\u25B6 Resume';
  else btn.textContent = '\u25B6 Play aloud';
}

function speakNext() {
  if (currentLineIdx >= currentLines.length) {
    isSpeaking = false; isPaused = false;
    updatePlayerUI(); highlightLine(-1);
    return;
  }
  const line = currentLines[currentLineIdx];
  highlightLine(currentLineIdx);
  const utter = new SpeechSynthesisUtterance(line.text);
  const v = pickVoice(line.who);
  if (v) utter.voice = v;
  utter.pitch = line.who === 'wren' ? 1.1 : 0.8;
  utter.rate = 1;
  utter.onend = () => { currentLineIdx++; speakNext(); };
  synth.speak(utter);
}

function startScript() {
  synth.cancel();
  currentLines = books[currentBook].depths[currentDepth].listen;
  currentLineIdx = 0;
  isSpeaking = true; isPaused = false;
  updatePlayerUI();
  speakNext();
}

function togglePlay() {
  if (!isSpeaking) {
    startScript();
  } else if (isPaused) {
    synth.resume(); isPaused = false; updatePlayerUI();
  } else {
    synth.pause(); isPaused = true; updatePlayerUI();
  }
}

function stopScript() {
  synth.cancel();
  isSpeaking = false; isPaused = false;
  updatePlayerUI(); highlightLine(-1);
}

// ---- Rendering ----
function renderTabs() {
  const nav = document.getElementById('bookTabs');
  nav.innerHTML = books.map((b, i) => `
    <button class="book-tab ${i === currentBook ? 'active' : ''}" data-idx="${i}">
      <span class="numeral">${b.numeral}</span>
      <span class="label">${b.label}</span>
    </button>
  `).join('');
  nav.querySelectorAll('.book-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      stopScript();
      currentBook = parseInt(btn.dataset.idx);
      currentCharacter = 'combined';
      helperOpen = false;
      renderTabs();
      renderContent();
      renderCast();
      renderSetting();
      renderHelper();
    });
  });
}

function renderHelper() {
  const wrap = document.getElementById('helper-wrap');
  const book = books[currentBook];
  if (!helperOpen) {
    wrap.innerHTML = `<button class="helper-link" id="helperOpenBtn">Not sure what you need for Book ${book.numeral}? Help me choose &rarr;</button>`;
    document.getElementById('helperOpenBtn').addEventListener('click', () => {
      helperOpen = true;
      renderHelper();
    });
  } else {
    wrap.innerHTML = `
      <div class="helper-card">
        <p class="helper-q">What are you looking for in ${book.title}?</p>
        <div class="helper-options">
          ${helperOptions.map(o => `<button class="helper-option" data-depth="${o.depth}">${o.label}</button>`).join('')}
        </div>
        <button class="helper-close" id="helperCloseBtn">Never mind</button>
      </div>
    `;
    wrap.querySelectorAll('.helper-option').forEach(btn => {
      btn.addEventListener('click', () => {
        stopScript();
        currentDepth = btn.dataset.depth;
        currentCharacter = 'combined';
        helperOpen = false;
        renderDepthToggle();
        renderContent();
        renderHelper();
      });
    });
    document.getElementById('helperCloseBtn').addEventListener('click', () => {
      helperOpen = false;
      renderHelper();
    });
  }
}

function renderDepthToggle() {
  const wrap = document.getElementById('depthToggle');
  wrap.innerHTML = depthOrder.map(d => `
    <button class="depth-btn ${d === currentDepth ? 'active' : ''}" data-depth="${d}">${depthLabels[d]}</button>
  `).join('');
  document.getElementById('depthDescription').textContent = depthDescriptions[currentDepth];
  wrap.querySelectorAll('.depth-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      stopScript();
      currentDepth = btn.dataset.depth;
      currentCharacter = 'combined';
      renderDepthToggle();
      renderContent();
    });
  });
}

function renderParas(text) {
  return text.split('\n\n').map(p => `<p>${p}</p>`).join('');
}

function characterNamesForCurrentBook() {
  const bookCast = castByBook[currentBook];
  const names = [...bookCast.fresh, ...bookCast.returning.map(r => r.name)];
  return [...new Set(names)];
}

function renderContent() {
  const book = books[currentBook];
  const depth = book.depths[currentDepth];

  document.getElementById('bookHeading').innerHTML = `
    <h2>${book.title}</h2>
    <p>Book ${book.numeral} &middot; ${depthLabels[currentDepth]} &middot; ${currentMode === 'read' ? 'Written' : 'Audio'}</p>
  `;

  const content = document.getElementById('content');

  if (currentMode === 'read') {
    if (currentDepth === 'detailed') {
      const d = depth.read;
      content.innerHTML = `
        <div class="card"><h3>The Situation</h3>${renderParas(d.situation)}</div>
        <div class="card"><h3>What Happens</h3><ul>${d.events.map(e => `<li>${e}</li>`).join('')}</ul></div>
        <div class="card"><h3>Where Hearts Stand</h3>${renderParas(d.relationships)}</div>
        <div class="card cliffhanger"><h3>Where It Left Off</h3><p>${d.cliffhanger}</p></div>
      `;
    } else if (currentDepth === 'timeline') {
      content.innerHTML = `
        <div class="card">
          <div class="timeline-track">
            ${depth.read.map(item => `
              ${item.phase ? `<p class="timeline-phase-label">${item.phase}</p>` : ''}
              <div class="timeline-item"><span class="timeline-dot"></span><p>${item.text}</p></div>
            `).join('')}
          </div>
        </div>
      `;
    } else if (currentDepth === 'character') {
      const names = characterNamesForCurrentBook();
      const chips = ['combined', ...names];
      const text = currentCharacter === 'combined'
        ? depth.read
        : (characterThreadByBook[currentBook][currentCharacter] || depth.read);
      content.innerHTML = `
        <div class="char-chip-row">
          ${chips.map(c => `
            <button class="char-chip ${c === currentCharacter ? 'active' : ''}" data-char="${c}">${c === 'combined' ? 'Combined' : c}</button>
          `).join('')}
        </div>
        <div class="card">${renderParas(text)}</div>
      `;
      content.querySelectorAll('.char-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          currentCharacter = btn.dataset.char;
          renderContent();
        });
      });
    } else {
      content.innerHTML = `<div class="card">${renderParas(depth.read)}</div>`;
    }
  } else {
    const lines = depth.listen;
    content.innerHTML = `
      <div class="player-bar">
        <button class="player-btn" id="playBtn">\u25B6 Play aloud</button>
        <button class="player-btn stop" id="stopBtn">\u23F9 Stop</button>
      </div>
      <p class="player-note">Uses your browser's built-in voices &mdash; quality varies by device.</p>
      <div class="card">
        <div class="transcript">
          ${lines.map(line => `
            <div class="line ${line.who}">
              <span class="speaker">${line.who === 'wren' ? 'Wren' : 'Sol'}</span>
              <div class="bubble">${line.text}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
    document.getElementById('playBtn').addEventListener('click', togglePlay);
    document.getElementById('stopBtn').addEventListener('click', stopScript);
    updatePlayerUI();
  }
}

function renderCast() {
  const panel = document.getElementById('cast-panel');
  const book = books[currentBook];
  const bookCast = castByBook[currentBook];

  const freshHtml = bookCast.fresh.length
    ? bookCast.fresh.map(name => {
        const c = castMaster[name];
        return `
          <div class="cast-card">
            <p class="name">${name}</p>
            <p class="role">${c.role}</p>
            <p class="trait">${c.trait}</p>
            <p class="note">${c.note}</p>
          </div>
        `;
      }).join('')
    : `<p class="cast-empty">No new characters introduced in Book ${book.numeral} — this one's about the cast you already know.</p>`;

  const returningHtml = bookCast.returning.length
    ? bookCast.returning.map(r => `
        <div class="returning-row">
          <span class="rname">${r.name}</span>
          <span class="rchange">${r.change}</span>
        </div>
      `).join('')
    : `<p class="cast-empty">Nobody returning yet — this is the first book.</p>`;

  panel.innerHTML = `
    <p class="cast-section-label">New in Book ${book.numeral}</p>
    ${freshHtml}
    <p class="cast-section-label">Returning — what's changed</p>
    ${returningHtml}
  `;
}

function renderSetting() {
  const panel = document.getElementById('setting-panel');
  const book = books[currentBook];
  panel.innerHTML = `
    <p class="cast-section-label">Where We Are — Book ${book.numeral}</p>
    <div class="card"><p>${settingByBook[currentBook]}</p></div>
  `;
}

// Character Arcs — series-wide, independent of the currently selected book
const arcNames = Object.keys(characterArcs);
let currentArcPerson = arcNames[0];
let currentArcFacet = 'general';

function renderArcs() {
  const panel = document.getElementById('arcs-panel');
  const arc = characterArcs[currentArcPerson];

  const personRow = `
    <div class="arc-person-row">
      ${arcNames.map(name => `
        <button class="arc-person-chip ${name === currentArcPerson ? 'active' : ''}" data-name="${name}">${name === 'Elain & Lucien' ? 'Elain & Lucien' : name.split(' ')[0]}</button>
      `).join('')}
    </div>
  `;

  let facetRow = '';
  let body = '';
  if (arc.kind === 'person') {
    facetRow = `
      <div class="arc-facet-row">
        <button class="arc-facet-btn ${currentArcFacet === 'general' ? 'active' : ''}" data-facet="general">General Arc</button>
        <button class="arc-facet-btn ${currentArcFacet === 'facet' ? 'active' : ''}" data-facet="facet">${arc.facetLabel}</button>
      </div>
    `;
    body = renderParas(currentArcFacet === 'general' ? arc.general : arc.facet);
  } else {
    body = renderParas(arc.general);
  }

  panel.innerHTML = `
    <p class="cast-section-label">Character Arcs — across all five books</p>
    ${personRow}
    ${facetRow}
    <div class="card">${body}</div>
  `;

  panel.querySelectorAll('.arc-person-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      currentArcPerson = btn.dataset.name;
      currentArcFacet = 'general';
      renderArcs();
    });
  });
  panel.querySelectorAll('.arc-facet-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentArcFacet = btn.dataset.facet;
      renderArcs();
    });
  });
}

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    stopScript();
    currentMode = btn.dataset.mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderContent();
  });
});

document.getElementById('cast-toggle').addEventListener('click', () => {
  const panel = document.getElementById('cast-panel');
  panel.classList.toggle('hidden');
  document.getElementById('cast-toggle').textContent = panel.classList.contains('hidden')
    ? "Open the Cast — who's who"
    : "Close the Cast";
});

document.getElementById('setting-toggle').addEventListener('click', () => {
  const panel = document.getElementById('setting-panel');
  panel.classList.toggle('hidden');
  document.getElementById('setting-toggle').textContent = panel.classList.contains('hidden')
    ? "Where We Are"
    : "Close the Setting";
});

let currentView = 'book';
function setView(view) {
  currentView = view;
  stopScript();
  document.getElementById('book-view-wrap').classList.toggle('hidden', view !== 'book');
  document.getElementById('arcs-view-wrap').classList.toggle('hidden', view !== 'arcs');
  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  if (view === 'arcs') renderArcs();
}
document.querySelectorAll('.view-btn').forEach(btn => {
  btn.addEventListener('click', () => setView(btn.dataset.view));
});

renderTabs();
renderDepthToggle();
renderContent();
renderCast();
renderSetting();
renderHelper();
setView('book');
</script>
</body>
</html>
